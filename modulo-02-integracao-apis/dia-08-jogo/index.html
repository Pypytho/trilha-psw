<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Reflexo & Tempo de Reação</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --color-waiting: #ef4444;    /* Vermelho: Esperando */
            --color-ready: #22c55e;      /* Verde: Clique agora! */
            --color-warning: #f59e0b;    /* Amarelo: Queimou */
            --color-idle: #3b82f6;       /* Azul: Início */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 2rem;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .controls-panel {
            background: var(--card-bg);
            padding: 15px 25px;
            border-radius: 12px;
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        label { font-size: 0.9rem; color: var(--text-muted); }

        select, button.btn-setup {
            background: #334155;
            color: #fff;
            border: 1px solid #475569;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            outline: none;
        }

        /* ÁREA PRINCIPAL DO JOGO */
        .game-area {
            width: 100%;
            max-width: 500px;
            height: 380px;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            background-color: var(--color-idle);
        }

        .game-area:active {
            transform: scale(0.98);
        }

        .target-circle {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 4px solid rgba(255, 255, 255, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            font-size: 2.5rem;
        }

        .game-status-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .game-status-sub {
            font-size: 1rem;
            opacity: 0.9;
        }

        /* PAINEL DE ESTATÍSTICAS */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 500px;
            margin-top: 25px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--color-ready);
            margin-top: 5px;
        }

        .history-list {
            width: 100%;
            max-width: 500px;
            margin-top: 20px;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            max-height: 150px;
            overflow-y: auto;
        }

        .history-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            padding: 4px 0;
            border-bottom: 1px solid #334155;
        }
    </style>
</head>
<body>

    <header>
        <h1>ReflexTester</h1>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Teste sua velocidade de reação em milissegundos</p>
    </header>

    <div class="controls-panel">
        <label for="rounds-select">Modo de Jogo:</label>
        <select id="rounds-select" onchange="resetGame()">
            <option value="5">5 Rodadas</option>
            <option value="10">10 Rodadas</option>
            <option value="infinite">Indeterminado</option>
        </select>
        <button class="btn-setup" onclick="resetGame()">Reiniciar</button>
    </div>

    <!-- ÁREA CLICÁVEL DO JOGO -->
    <div class="game-area" id="game-area" onclick="handleAreaClick()">
        <div class="target-circle" id="target-icon">⚡</div>
        <div class="game-status-title" id="status-title">Clique para Iniciar</div>
        <div class="game-status-sub" id="status-sub">Prepare seus reflexos</div>
    </div>

    <!-- PAINEL DE ESTATÍSTICAS -->
    <div class="stats-grid">
        <div class="stat-card">
            <label>Último</label>
            <div class="stat-value" id="stat-last">-- ms</div>
        </div>
        <div class="stat-card">
            <label>Melhor</label>
            <div class="stat-value" id="stat-best">-- ms</div>
        </div>
        <div class="stat-card">
            <label>Média</label>
            <div class="stat-value" id="stat-avg">-- ms</div>
        </div>
    </div>

    <div class="history-list">
        <div class="history-title">Histórico de Rodadas</div>
        <div id="history-items">
            <div style="color: var(--text-muted); font-size: 0.8rem;">Nenhuma rodada executada ainda.</div>
        </div>
    </div>

    <script>
        // ESTADOS DO JOGO: 'IDLE' | 'WAITING' | 'READY' | 'FALSE_START' | 'FINISHED'
        let state = 'IDLE';
        let timerId = null;
        let startTime = 0;
        let currentRound = 0;
        let totalRounds = 5;
        let reactionTimes = [];

        const gameArea = document.getElementById('game-area');
        const statusTitle = document.getElementById('status-title');
        const statusSub = document.getElementById('status-sub');
        const targetIcon = document.getElementById('target-icon');

        function updateSettings() {
            const val = document.getElementById('rounds-select').value;
            totalRounds = val === 'infinite' ? Infinity : parseInt(val);
        }

        function resetGame() {
            clearTimeout(timerId);
            updateSettings();
            state = 'IDLE';
            currentRound = 0;
            reactionTimes = [];
            
            gameArea.style.backgroundColor = 'var(--color-idle)';
            targetIcon.innerText = '⚡';
            statusTitle.innerText = 'Clique para Iniciar';
            statusSub.innerText = totalRounds === Infinity ? 'Modo Indeterminado' : `0 de ${totalRounds} rodadas completadas`;
            
            document.getElementById('stat-last').innerText = '-- ms';
            document.getElementById('stat-best').innerText = '-- ms';
            document.getElementById('stat-avg').innerText = '-- ms';
            document.getElementById('history-items').innerHTML = `<div style="color: var(--text-muted); font-size: 0.8rem;">Nenhuma rodada executada ainda.</div>`;
        }

        function handleAreaClick() {
            switch (state) {
                case 'IDLE':
                case 'RESULT':
                case 'FALSE_START':
                    startNextRound();
                    break;

                case 'WAITING':
                    // Usuário clicou antes da cor mudar ("Queimou")
                    handleFalseStart();
                    break;

                case 'READY':
                    // Clique válido no momento verde
                    handleValidClick();
                    break;

                case 'FINISHED':
                    resetGame();
                    startNextRound();
                    break;
            }
        }

        function startNextRound() {
            if (currentRound >= totalRounds && totalRounds !== Infinity) {
                finishGame();
                return;
            }

            state = 'WAITING';
            gameArea.style.backgroundColor = 'var(--color-waiting)';
            targetIcon.innerText = '✋';
            statusTitle.innerText = 'Aguarde a cor mudar...';
            statusSub.innerText = 'Não clique ainda!';

            // Tempo de espera aleatório entre 2 e 5 segundos
            const randomDelay = Math.floor(Math.random() * 3000) + 2000;

            timerId = setTimeout(() => {
                state = 'READY';
                startTime = performance.now(); // Marca o tempo com precisão de microssegundos
                gameArea.style.backgroundColor = 'var(--color-ready)';
                targetIcon.innerText = '🎯';
                statusTitle.innerText = 'CLIQUE AGORA!';
                statusSub.innerText = 'O mais rápido que puder!';
            }, randomDelay);
        }

        function handleFalseStart() {
            clearTimeout(timerId);
            state = 'FALSE_START';
            gameArea.style.backgroundColor = 'var(--color-warning)';
            targetIcon.innerText = '⚠️';
            statusTitle.innerText = 'Você queimou a largada!';
            statusSub.innerText = 'Clicou antes da cor mudar. Clique para tentar novamente.';
        }

        function handleValidClick() {
            const endTime = performance.now();
            const timeMs = Math.round(endTime - startTime);
            reactionTimes.push(timeMs);
            currentRound++;

            state = 'RESULT';
            gameArea.style.backgroundColor = 'var(--color-idle)';
            targetIcon.innerText = '⏱️';
            statusTitle.innerText = `${timeMs} ms`;

            const roundInfo = totalRounds === Infinity ? `Rodada ${currentRound}` : `Rodada ${currentRound} de ${totalRounds}`;
            statusSub.innerText = `${roundInfo}. Clique para continuar.`;

            updateStats(timeMs);

            if (currentRound >= totalRounds && totalRounds !== Infinity) {
                finishGame();
            }
        }

        function updateStats(lastTime) {
            document.getElementById('stat-last').innerText = `${lastTime} ms`;

            const best = Math.min(...reactionTimes);
            document.getElementById('stat-best').innerText = `${best} ms`;

            const avg = Math.round(reactionTimes.reduce((a, b) => a + b, 0) / reactionTimes.length);
            document.getElementById('stat-avg').innerText = `${avg} ms`;

            // Atualiza lista de histórico
            const historyContainer = document.getElementById('history-items');
            if (reactionTimes.length === 1) historyContainer.innerHTML = '';

            const item = document.createElement('div');
            item.className = 'history-item';
            item.innerHTML = `<span>Rodada ${currentRound}</span><strong>${lastTime} ms</strong>`;
            historyContainer.prepend(item);
        }

        function finishGame() {
            state = 'FINISHED';
            const avg = Math.round(reactionTimes.reduce((a, b) => a + b, 0) / reactionTimes.length);
            const best = Math.min(...reactionTimes);

            gameArea.style.backgroundColor = 'var(--color-idle)';
            targetIcon.innerText = '🏆';
            statusTitle.innerText = `Fim do Jogo! Média: ${avg} ms`;
            statusSub.innerText = `Melhor tempo: ${best} ms. Clique para jogar novamente.`;
        }

        // Inicializa o jogo ao carregar
        window.onload = updateSettings;
    </script>
</body>
</html>
