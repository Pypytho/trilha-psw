<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Drible 360 | Controle de Bola Livre</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #080d1a;
            --card-bg: #111827;
            --pitch-green: #15803d;
            --accent-gold: #fbbf24;
            --accent-red: #ef4444;
            --accent-blue: #38bdf8;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            touch-action: none; /* Impede rolagem na tela ao arrastar a bola */
            user-select: none;
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 8px;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--accent-gold);
            letter-spacing: 1px;
        }

        .hud-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 450px;
            margin-bottom: 8px;
            background: var(--card-bg);
            padding: 8px 16px;
            border-radius: 10px;
            border: 1px solid #1f2937;
        }

        .hud-item { text-align: center; }
        .hud-label { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
        .hud-val { font-size: 1.1rem; font-weight: 900; color: #fff; }

        .game-wrapper {
            position: relative;
            width: 100%;
            max-width: 450px;
            aspect-ratio: 1 / 1;
        }

        canvas {
            width: 100%;
            height: 100%;
            background-color: var(--pitch-green);
            border-radius: 16px;
            display: block;
            border: 3px solid #1e293b;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        /* OVERLAYS DE MENU */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(8, 13, 26, 0.9);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            backdrop-filter: blur(5px);
        }

        .overlay h2 {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--accent-gold);
            margin-bottom: 8px;
        }

        .overlay p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .btn-main {
            background: linear-gradient(135deg, var(--accent-gold), #d97706);
            color: #000;
            border: none;
            padding: 12px 28px;
            font-size: 0.95rem;
            border-radius: 30px;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(251, 191, 36, 0.3);
        }

        .instructions {
            margin-top: 8px;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>DRIBLE 360°</h1>
    </header>

    <div class="hud-bar">
        <div class="hud-item">
            <div class="hud-label">Dribles</div>
            <div class="hud-val" id="hud-dribbles" style="color: var(--accent-gold);">0</div>
        </div>
        <div class="hud-item">
            <div class="hud-label">Tempo</div>
            <div class="hud-val" id="hud-time">0.0s</div>
        </div>
        <div class="hud-item">
            <div class="hud-label">Recorde</div>
            <div class="hud-val" id="hud-record" style="color: var(--accent-blue);">0</div>
        </div>
    </div>

    <div class="game-wrapper">
        <canvas id="canvas" width="450" height="450"></canvas>

        <!-- MENU INICIAL -->
        <div class="overlay" id="menu-overlay">
            <h2>DOMINE A BOLA</h2>
            <p>Arraste a bola com o dedo. Os zagueiros virão de todas as direções para dar o bote. Mude de direção no momento certo!</p>
            <button class="btn-main" onclick="startGame()">INICIAR JOGO</button>
        </div>

        <!-- GAMEOVER -->
        <div class="overlay" id="gameover-overlay" style="display: none;">
            <h2 style="color: var(--accent-red);" id="gameover-title">BOLA ROUBADA!</h2>
            <p id="gameover-desc">O zagueiro acertou o bote na bola.</p>
            <button class="btn-main" onclick="startGame()">TENTAR NOVAMENTE</button>
        </div>
    </div>

    <div class="instructions">
        💡 <strong>Dica:</strong> Toque e segure na bola para conduzi-la pelo gramado.
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // AUDIO SINTETIZADO PROCEDURAL
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playSound(type) {
            if (!audioCtx) audioCtx = new AudioCtx();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'dodge') {
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'tackle_miss') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'whistle') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(1600, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // ESTADOS DO JOGO
        let gameState = 'MENU';
        let dribbleCount = 0;
        let startTime = 0;
        let animId = null;
        let highscore = localStorage.getItem('dribble_360_record') || 0;

        document.getElementById('hud-record').innerText = highscore;

        // BOLA (JOGADOR)
        const ball = {
            x: 225,
            y: 225,
            targetX: 225,
            targetY: 225,
            radius: 14,
            rotation: 0
        };

        // CONTROLE TOQUE / MOUSE
        let isPointerDown = false;

        function updatePointerPos(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const x = (clientX - rect.left) * (canvas.width / rect.width);
            const y = (clientY - rect.top) * (canvas.height / rect.height);

            // Mantém a bola dentro do gramado
            ball.targetX = Math.max(ball.radius, Math.min(canvas.width - ball.radius, x));
            ball.targetY = Math.max(ball.radius, Math.min(canvas.height - ball.radius, y));
        }

        canvas.addEventListener('pointerdown', (e) => {
            isPointerDown = true;
            updatePointerPos(e.clientX, e.clientY);
        });

        canvas.addEventListener('pointermove', (e) => {
            if (isPointerDown || gameState === 'PLAYING') {
                updatePointerPos(e.clientX, e.clientY);
            }
        });

        canvas.addEventListener('pointerup', () => isPointerDown = false);

        // ZAGUEIROS (DEFENSORES)
        let defenders = [];
        let particles = [];
        let lastSpawn = 0;

        function spawnDefender() {
            // Define de qual borda o zagueiro vai nascer (0=Top, 1=Right, 2=Bottom, 3=Left)
            const side = Math.floor(Math.random() * 4);
            let x, y;

            if (side === 0) { x = Math.random() * canvas.width; y = -25; }
            else if (side === 1) { x = canvas.width + 25; y = Math.random() * canvas.height; }
            else if (side === 2) { x = Math.random() * canvas.width; y = canvas.height + 25; }
            else { x = -25; y = Math.random() * canvas.height; }

            defenders.push({
                x: x,
                y: y,
                radius: 16,
                speed: 1.8 + Math.random() * 0.8 + (dribbleCount * 0.05), // Acelera suavemente com o placar
                state: 'APPROACH', // 'APPROACH', 'PREPARE_BOTE', 'LUNGING', 'RECOVER'
                targetBoteX: 0,
                targetBoteY: 0,
                timer: 0,
                lungeVx: 0,
                lungeVy: 0
            });
        }

        function startGame() {
            document.getElementById('menu-overlay').style.display = 'none';
            document.getElementById('gameover-overlay').style.display = 'none';

            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.targetX = ball.x;
            ball.targetY = ball.y;

            defenders = [];
            particles = [];
            dribbleCount = 0;
            startTime = performance.now();
            lastSpawn = performance.now();

            document.getElementById('hud-dribbles').innerText = "0";
            document.getElementById('hud-time').innerText = "0.0s";

            gameState = 'PLAYING';
            playSound('whistle');

            if (animId) cancelAnimationFrame(animId);
            loop();
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            playSound('tackle_miss');

            const finalTime = ((performance.now() - startTime) / 1000).toFixed(1);

            if (dribbleCount > highscore) {
                highscore = dribbleCount;
                localStorage.setItem('dribble_360_record', highscore);
                document.getElementById('hud-record').innerText = highscore;
            }

            document.getElementById('gameover-desc').innerText = `Você deu ${dribbleCount} drible(s) em ${finalTime}s de jogo.`;
            document.getElementById('gameover-overlay').style.display = 'flex';
        }

        // DESENHAR O GRAMADO
        function drawPitch() {
            // Fundo
            ctx.fillStyle = '#15803d';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Listras do Gramado
            ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
            for (let i = 0; i < canvas.height; i += 50) {
                if ((i / 50) % 2 === 0) {
                    ctx.fillRect(0, i, canvas.width, 50);
                }
            }

            // Linhas de Demarcação do Campo
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.lineWidth = 3;

            // Borda externa
            ctx.strokeRect(15, 15, canvas.width - 30, canvas.height - 30);

            // Círculo Central
            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height / 2, 60, 0, Math.PI * 2);
            ctx.stroke();

            // Ponto Central
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height / 2, 4, 0, Math.PI * 2);
            ctx.fill();
        }

        // LOOP PRINCIPAL DO JOGO
        function loop() {
            const now = performance.now();
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawPitch();

            if (gameState === 'PLAYING') {
                const elapsed = ((now - startTime) / 1000).toFixed(1);
                document.getElementById('hud-time').innerText = `${elapsed}s`;

                // Gerar zagueiros periodicamente
                if (now - lastSpawn > Math.max(800, 2200 - (dribbleCount * 80))) {
                    spawnDefender();
                    lastSpawn = now;
                }

                // Movimentação suave da bola até a posição do toque
                const dx = ball.targetX - ball.x;
                const dy = ball.targetY - ball.y;
                const dist = Math.hypot(dx, dy);

                if (dist > 2) {
                    ball.x += dx * 0.25;
                    ball.y += dy * 0.25;
                    ball.rotation += dist * 0.05;

                    // Partículas de grama ao mover rápido
                    if (dist > 8 && Math.random() > 0.6) {
                        particles.push({
                            x: ball.x, y: ball.y + 10,
                            vx: (Math.random() - 0.5) * 2, vy: (Math.random() - 0.5) * 2,
                            life: 1.0, color: '#bbf7d0'
                        });
                    }
                }
            }

            // ATUALIZAR E DESENHAR ZAGUEIROS
            for (let i = defenders.length - 1; i >= 0; i--) {
                const d = defenders[i];

                if (gameState === 'PLAYING') {
                    const distToBall = Math.hypot(ball.x - d.x, ball.y - d.y);

                    if (d.state === 'APPROACH') {
                        // Persegue a bola
                        const angle = Math.atan2(ball.y - d.y, ball.x - d.x);
                        d.x += Math.cos(angle) * d.speed;
                        d.y += Math.sin(angle) * d.speed;

                        // Se chegar a menos de 110px da bola, PREPARA O BOTE!
                        if (distToBall < 110) {
                            d.state = 'PREPARE_BOTE';
                            d.targetBoteX = ball.x;
                            d.targetBoteY = ball.y;
                            d.timer = now;
                        }
                    } 
                    else if (d.state === 'PREPARE_BOTE') {
                        // Trava a mira por 0.35s (Aviso do bote)
                        if (now - d.timer > 350) {
                            d.state = 'LUNGING';
                            const lungeAngle = Math.atan2(d.targetBoteX - d.y, d.targetBoteX - d.x);
                            const speedLunge = 8.5; // Velocidade do bote / carrinho
                            d.lungeVx = Math.cos(Math.atan2(d.targetBoteY - d.y, d.targetBoteX - d.x)) * speedLunge;
                            d.lungeVy = Math.sin(Math.atan2(d.targetBoteY - d.y, d.targetBoteX - d.x)) * speedLunge;
                            d.timer = now;
                        }
                    } 
                    else if (d.state === 'LUNGING') {
                        // Executa o carrinho / bote rápido
                        d.x += d.lungeVx;
                        d.y += d.lungeVy;

                        if (now - d.timer > 250) {
                            d.state = 'RECOVER';
                            d.timer = now;
                            
                            // Se o zagueiro deu o bote e errou a bola: DRIBLE COMPUTADO!
                            if (distToBall > ball.radius + d.radius + 10) {
                                dribbleCount++;
                                document.getElementById('hud-dribbles').innerText = dribbleCount;
                                playSound('dodge');
                            }
                        }
                    } 
                    else if (d.state === 'RECOVER') {
                        // Fica caído/recuperando por 0.8s
                        if (now - d.timer > 800) {
                            d.state = 'APPROACH';
                        }
                    }

                    // Checagem de Colisão (Se o bote acertou a bola)
                    if (distToBall < ball.radius + d.radius - 2) {
                        gameOver();
                    }
                }

                // DESENHO DO ZAGUEIRO
                // Linha de Aviso do Bote (Telegrafado)
                if (d.state === 'PREPARE_BOTE') {
                    ctx.strokeStyle = 'rgba(239, 68, 68, 0.8)';
                    ctx.lineWidth = 3;
                    ctx.setLineDash([6, 6]);
                    ctx.beginPath();
                    ctx.moveTo(d.x, d.y);
                    ctx.lineTo(d.targetBoteX, d.targetBoteY);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }

                // Sombra do Zagueiro
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath();
                ctx.ellipse(d.x, d.y + 12, d.radius, d.radius * 0.4, 0, 0, Math.PI * 2);
                ctx.fill();

                // Corpo do Zagueiro (Vermelho no bote, azul na aproximação)
                ctx.fillStyle = d.state === 'LUNGING' ? '#ef4444' : '#1e3a8a';
                ctx.beginPath();
                ctx.arc(d.x, d.y, d.radius, 0, Math.PI * 2);
                ctx.fill();

                // Camisa / Detalhe
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(d.x, d.y, d.radius * 0.4, 0, Math.PI * 2);
                ctx.fill();

                // Animação de Carrinho (Perna esticada)
                if (d.state === 'LUNGING') {
                    ctx.strokeStyle = '#ef4444';
                    ctx.lineWidth = 6;
                    ctx.beginPath();
                    ctx.moveTo(d.x, d.y);
                    ctx.lineTo(d.x + d.lungeVx * 2.5, d.y + d.lungeVy * 2.5);
                    ctx.stroke();
                }

                // Remover zagueiros muito distantes fora do campo
                if (d.x < -100 || d.x > canvas.width + 100 || d.y < -100 || d.y > canvas.height + 100) {
                    defenders.splice(i, 1);
                }
            }

            // DESENHAR PARTÍCULAS
            for (let i = particles.length - 1; i >= 0; i--) {
                const pt = particles[i];
                pt.x += pt.vx;
                pt.y += pt.vy;
                pt.life -= 0.05;

                ctx.fillStyle = pt.color;
                ctx.globalAlpha = Math.max(0, pt.life);
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;

                if (pt.life <= 0) particles.splice(i, 1);
            }

            // DESENHAR A BOLA (JOGADOR)
            // Sombra da Bola
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.beginPath();
            ctx.ellipse(ball.x, ball.y + 14, ball.radius, ball.radius * 0.4, 0, 0, Math.PI * 2);
            ctx.fill();

            // Esfera
            ctx.save();
            ctx.translate(ball.x, ball.y);
            ctx.rotate(ball.rotation);

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(0, 0, ball.radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Gomos da Bola
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(0, 0, 5, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(8, -6, 3, 0, Math.PI * 2);
            ctx.arc(-8, 6, 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();

            if (gameState === 'PLAYING') {
                animId = requestAnimationFrame(loop);
            }
        }

        // Desenhar campo estático no início
        drawPitch();
    </script>
</body>
</html>
