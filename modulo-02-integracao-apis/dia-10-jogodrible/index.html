<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Dribbler 1P | Simulador de Drible 3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #060911;
            --card-bg: #111827;
            --field-green: #15803d;
            --accent-gold: #fbbf24;
            --accent-red: #ef4444;
            --accent-blue: #38bdf8;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            touch-action: manipulation;
            user-select: none;
        }

        header {
            text-align: center;
            margin-bottom: 10px;
        }

        header h1 {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--accent-gold);
            letter-spacing: 2px;
            text-shadow: 0 0 12px rgba(251, 191, 36, 0.4);
        }

        .game-wrapper {
            position: relative;
            width: 100%;
            max-width: 480px;
            aspect-ratio: 4 / 5;
        }

        canvas {
            width: 100%;
            height: 100%;
            background-color: #000;
            border-radius: 16px;
            display: block;
            border: 2px solid #1f2937;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        /* OVERLAYS DE INTERFACE */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(6, 9, 17, 0.88);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 25px;
            backdrop-filter: blur(6px);
        }

        .overlay h2 {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--accent-gold);
            margin-bottom: 8px;
        }

        .overlay p {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .btn-main {
            background: linear-gradient(135deg, var(--accent-gold), #d97706);
            color: #000;
            border: none;
            padding: 14px 32px;
            font-size: 1rem;
            border-radius: 30px;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(251, 191, 36, 0.4);
            transition: transform 0.15s;
        }

        .btn-main:active { transform: scale(0.95); }

        /* CONTROLES DE DIREÇÃO (MOBILE / TELA) */
        .controls-container {
            display: flex;
            gap: 15px;
            width: 100%;
            max-width: 480px;
            margin-top: 12px;
        }

        .btn-dribble {
            flex: 1;
            background: var(--card-bg);
            border: 2px solid #374151;
            color: var(--text-main);
            padding: 16px 0;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: background 0.1s, border-color 0.1s;
        }

        .btn-dribble:active {
            background: #1f2937;
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        .hud-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 480px;
            margin-bottom: 8px;
            background: var(--card-bg);
            padding: 10px 16px;
            border-radius: 10px;
        }

        .hud-item { text-align: center; }
        .hud-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
        .hud-val { font-size: 1.2rem; font-weight: 900; color: #fff; }
    </style>
</head>
<body>

    <header>
        <h1>PRO DRIBLER 1P</h1>
    </header>

    <div class="hud-bar">
        <div class="hud-item">
            <div class="hud-label">Dribles</div>
            <div class="hud-val" id="hud-dribbles" style="color: var(--accent-gold);">0</div>
        </div>
        <div class="hud-item">
            <div class="hud-label">Velocidade</div>
            <div class="hud-val" id="hud-speed">24 km/h</div>
        </div>
        <div class="hud-item">
            <div class="hud-label">Recorde</div>
            <div class="hud-val" id="hud-record" style="color: var(--accent-blue);">0</div>
        </div>
    </div>

    <div class="game-wrapper">
        <canvas id="canvas" width="400" height="500"></canvas>

        <!-- MENU PRINCIPAL -->
        <div class="overlay" id="menu-overlay">
            <h2>X1 NO CAMPO</h2>
            <p>Enxergue o jogo em 1ª Pessoa! Quando o zagueiro der o bote, toque a bola na hora certa para desviar!</p>
            <button class="btn-main" onclick="startGame()">ENTRAR EM CAMPO</button>
        </div>

        <!-- TELA DE FIM DE JOGO -->
        <div class="overlay" id="gameover-overlay" style="display: none;">
            <h2 style="color: var(--accent-red);" id="gameover-title">DESARMADO!</h2>
            <p id="gameover-desc">O zagueiro roubou sua bola no bote.</p>
            <button class="btn-main" onclick="startGame()">TENTAR DE NOVO</button>
        </div>
    </div>

    <!-- BOTÕES NA TELA -->
    <div class="controls-container">
        <button class="btn-dribble" onclick="dribble('left')">⬅️ CORTAR ESQ</button>
        <button class="btn-dribble" onclick="dribble('right')">CORTAR DIR ➡️</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // SENSORIAIS / SOM PROCEDURAL (Sem arquivos externos)
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playSound(type) {
            if (!audioCtx) audioCtx = new AudioCtx();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'kick') {
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
                osc.start(); osc.stop(audioCtx.currentTime + 0.12);
            } else if (type === 'dribble') {
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'whistle') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(1800, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            }
        }

        // VARIÁVEIS DE JOGO
        let gameState = 'MENU'; // 'MENU', 'PLAYING', 'GAMEOVER'
        let dribbleCount = 0;
        let highscore = localStorage.getItem('dribble_1p_highscore') || 0;
        let gameSpeed = 8;
        let fieldOffset = 0;
        let animId = null;

        // POSIÇÃO DO JOGADOR (BOLA / PÉS)
        // Lanes: -1 (Esquerda), 0 (Centro), 1 (Direita)
        let playerLane = 0;
        let targetLane = 0;
        let ballX = 200;
        let ballAnimX = 200;

        // ESTATÍSTICAS
        document.getElementById('hud-record').innerText = highscore;

        // DEFENSOR (MARCADOR)
        let defender = null;

        function spawnDefender() {
            // Decide a posição e o tipo de bote
            const lanes = [-1, 0, 1];
            const startLane = lanes[Math.floor(Math.random() * lanes.length)];
            // Lunge Direction: -1 (Dá o bote para a esquerda), 1 (Dá o bote para a direita), 0 (Bote reto)
            const lungeDir = Math.random() > 0.5 ? 1 : -1;

            defender = {
                z: 800,               // Distância em profundidade
                lane: startLane,       // Posição na pista
                lungeDir: lungeDir,    // Direção para onde ele vai esticar a perna
                isLunging: false,      // Se ativou o bote
                lunged: false,         // Se o bote já foi executado
                color: '#ef4444'       // Vermelho
            };
        }

        // CONTROLES DE TECLADO
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') dribble('left');
            if (e.key === 'ArrowRight' || e.key === 'd') dribble('right');
        });

        function dribble(dir) {
            if (gameState !== 'PLAYING') return;

            if (dir === 'left' && targetLane > -1) {
                targetLane--;
                playSound('dribble');
            } else if (dir === 'right' && targetLane < 1) {
                targetLane++;
                playSound('dribble');
            }
        }

        function startGame() {
            document.getElementById('menu-overlay').style.display = 'none';
            document.getElementById('gameover-overlay').style.display = 'none';

            dribbleCount = 0;
            gameSpeed = 9;
            playerLane = 0;
            targetLane = 0;
            ballX = 200;
            ballAnimX = 200;
            
            document.getElementById('hud-dribbles').innerText = "0";
            document.getElementById('hud-speed').innerText = `${Math.round(gameSpeed * 3)} km/h`;

            spawnDefender();
            gameState = 'PLAYING';
            playSound('whistle');

            if (animId) cancelAnimationFrame(animId);
            loop();
        }

        function gameOver(reason) {
            gameState = 'GAMEOVER';
            playSound('kick');

            if (dribbleCount > highscore) {
                highscore = dribbleCount;
                localStorage.setItem('dribble_1p_highscore', highscore);
                document.getElementById('hud-record').innerText = highscore;
            }

            document.getElementById('gameover-title').innerText = "BOTE CERTO DO ZAGUEIRO!";
            document.getElementById('gameover-desc').innerText = `Você completou ${dribbleCount} drible(s) perfeitos antes de perder a bola.`;
            document.getElementById('gameover-overlay').style.display = 'flex';
        }

        // RENDERIZAÇÃO DO CAMPO EM PERSPECTIVA (PSEUDO 3D)
        function drawField() {
            const horizonY = 140;
            const width = canvas.width;
            const height = canvas.height;

            // Céu / Estádio (Fundo Escuro)
            const skyGradient = ctx.createLinearGradient(0, 0, 0, horizonY);
            skyGradient.addColorStop(0, '#020617');
            skyGradient.addColorStop(1, '#0f172a');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, width, horizonY);

            // Holofotes de Estádio no Fundo
            ctx.fillStyle = '#fef08a';
            ctx.shadowColor = '#fef08a';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(60, 60, 6, 0, Math.PI * 2);
            ctx.arc(340, 60, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Gramado do Campo
            const fieldGradient = ctx.createLinearGradient(0, horizonY, 0, height);
            fieldGradient.addColorStop(0, '#166534');
            fieldGradient.addColorStop(1, '#15803d');
            ctx.fillStyle = fieldGradient;
            ctx.fillRect(0, horizonY, width, height - horizonY);

            // Linhas Horizontais do Gramado (Movimento para frente)
            fieldOffset = (fieldOffset + gameSpeed) % 40;
            ctx.strokeStyle = 'rgba(255,255,255,0.15)';
            ctx.lineWidth = 2;

            for (let z = 1; z < 10; z++) {
                let py = horizonY + Math.pow(z / 10, 2) * (height - horizonY) + (fieldOffset * (z/10));
                if (py > horizonY && py < height) {
                    ctx.beginPath();
                    ctx.moveTo(0, py);
                    ctx.lineTo(width, py);
                    ctx.stroke();
                }
            }

            // Linhas de Demarcação Laterais (Perspectiva em V)
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            
            // Linha Esquerda
            ctx.beginPath();
            ctx.moveTo(120, horizonY);
            ctx.lineTo(-50, height);
            ctx.stroke();

            // Linha Direita
            ctx.beginPath();
            ctx.moveTo(280, horizonY);
            ctx.lineTo(450, height);
            ctx.stroke();
        }

        // RENDERIZAR O DEFENSOR EM 2.5D
        function drawDefender() {
            if (!defender) return;

            const horizonY = 140;
            const fov = 250;

            // Avançar zagueiro na direção do jogador
            if (gameState === 'PLAYING') {
                defender.z -= gameSpeed * 2.2;
            }

            // Ativar "BOTE" quando fica próximo (z < 320)
            if (defender.z < 320 && !defender.isLunging) {
                defender.isLunging = true;
                // Ajusta a lane do bote
                defender.lane = Math.max(-1, Math.min(1, defender.lane + defender.lungeDir));
            }

            // Projeção 3D -> 2D
            const scale = fov / Math.max(10, defender.z);
            const centerX = 200 + (defender.lane * 90 * scale);
            const screenY = horizonY + (160 * scale);
            const size = 70 * scale;

            if (defender.z > 10) {
                ctx.save();
                ctx.translate(centerX, screenY);

                // Sombra do Zagueiro
                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.beginPath();
                ctx.ellipse(0, size * 0.9, size * 0.5, size * 0.15, 0, 0, Math.PI * 2);
                ctx.fill();

                // Corpo / Camisa
                ctx.fillStyle = defender.color;
                ctx.beginPath();
                ctx.fillRect(-size * 0.35, -size * 0.8, size * 0.7, size * 0.6);

                // Cabeça
                ctx.fillStyle = '#fca5a5';
                ctx.beginPath();
                ctx.arc(0, -size * 0.95, size * 0.22, 0, Math.PI * 2);
                ctx.fill();

                // Pernas / Animação do BOTE
                ctx.strokeStyle = '#1e293b';
                ctx.lineWidth = Math.max(2, size * 0.1);

                if (defender.isLunging) {
                    // Perna esticada para dar o bote
                    ctx.strokeStyle = '#e11d48'; // Destaque vermelho no bote
                    ctx.beginPath();
                    ctx.moveTo(0, -size * 0.2);
                    ctx.lineTo((defender.lungeDir * size * 0.6), size * 0.8); // Chute de desarme
                    ctx.stroke();

                    // Perna de apoio
                    ctx.beginPath();
                    ctx.moveTo(-defender.lungeDir * size * 0.2, -size * 0.2);
                    ctx.lineTo(-defender.lungeDir * size * 0.3, size * 0.8);
                    ctx.stroke();
                } else {
                    // Pernas normais correndo
                    const legOffset = Math.sin(Date.now() * 0.02) * (size * 0.2);
                    ctx.beginPath();
                    ctx.moveTo(-size * 0.15, -size * 0.2);
                    ctx.lineTo(-size * 0.2, size * 0.8 + legOffset);
                    ctx.moveTo(size * 0.15, -size * 0.2);
                    ctx.lineTo(size * 0.2, size * 0.8 - legOffset);
                    ctx.stroke();
                }

                ctx.restore();
            }

            // CHECAGEM DE COLISÃO DO BOTE (Momento exato do desarme)
            if (defender.z < 60 && defender.z > -20 && gameState === 'PLAYING') {
                if (defender.lane === targetLane) {
                    gameOver("O zagueiro interceptou sua trajetória!");
                } else {
                    // Drible com Sucesso!
                    dribbleCount++;
                    gameSpeed += 0.4; // Aumenta o ritmo do jogo
                    document.getElementById('hud-dribbles').innerText = dribbleCount;
                    document.getElementById('hud-speed').innerText = `${Math.round(gameSpeed * 3)} km/h`;
                    playSound('dribble');
                    spawnDefender(); // Próximo zagueiro
                }
            } else if (defender.z <= -20) {
                spawnDefender(); // Respawn se passar direto
            }
        }

        // RENDERIZAR A BOLA E OS PÉS EM 1ª PESSOA (BOTTOM VIEW)
        function drawFirstPersonPlayer() {
            // Suavização do movimento horizontal da bola
            const targetX = 200 + (targetLane * 95);
            ballAnimX += (targetX - ballAnimX) * 0.25;

            const ballY = 430;
            const ballRadius = 24;

            ctx.save();

            // Pés / Chuteira em 1ª pessoa (Surgindo do rodapé)
            const legOffset = Math.sin(Date.now() * 0.015) * 8;
            ctx.fillStyle = '#0f172a';
            
            // Chuteira Esquerda
            ctx.beginPath();
            ctx.ellipse(ballAnimX - 35, 475 + legOffset, 16, 28, -0.2, 0, Math.PI * 2);
            ctx.fill();

            // Chuteira Direita
            ctx.beginPath();
            ctx.ellipse(ballAnimX + 35, 475 - legOffset, 16, 28, 0.2, 0, Math.PI * 2);
            ctx.fill();

            // Sombra da Bola
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.beginPath();
            ctx.ellipse(ballAnimX, ballY + 22, ballRadius * 0.8, 8, 0, 0, Math.PI * 2);
            ctx.fill();

            // Bola de Futebol (Textura e Rotação)
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(ballAnimX, ballY, ballRadius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Gomos Pretos da Bola (Animação de rotação conforme anda)
            const rotation = (Date.now() * 0.01 * (gameSpeed / 8)) % (Math.PI * 2);
            ctx.fillStyle = '#1e293b';
            ctx.beginPath();
            ctx.arc(ballAnimX + Math.cos(rotation) * 8, ballY + Math.sin(rotation) * 8, 7, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        // LOOP PRINCIPAL DE RENDERIZAÇÃO
        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawField();
            drawDefender();
            drawFirstPersonPlayer();

            if (gameState === 'PLAYING') {
                animId = requestAnimationFrame(loop);
            }
        }

        // Desenhar tela inicial parada
        drawField();
        drawFirstPersonPlayer();
    </script>
</body>
</html>
