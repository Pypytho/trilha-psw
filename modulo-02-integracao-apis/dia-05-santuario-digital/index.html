<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busca de Santos</title>
    <!-- CDN do Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.min.js"></script>
    <style>
        .hidden { display: none !important; }
        .chip { cursor: pointer; padding: 6px 12px; background: #eee; border-radius: 16px; display: inline-block; margin: 4px; }
        #saint-card { border: 1px solid #ccc; padding: 16px; margin-top: 16px; border-radius: 8px; }
        #saint-img { max-width: 200px; display: block; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div>
        <input type="text" id="saint-input" placeholder="Digite o nome...">
        <button type="button" id="search-btn">Pesquisar</button>
    </div>

    <div>
        <span class="chip" data-name="São Francisco de Assis">São Francisco</span>
        <span class="chip" data-name="Santo Agostinho">Santo Agostinho</span>
        <span class="chip" data-name="Santa Rita de Cássia">Santa Rita</span>
    </div>

    <p id="status-message"></p>

    <div id="saint-card" class="hidden">
        <h2 id="saint-name"></h2>
        <img id="saint-img" src="" alt="Imagem" style="display: none;">
        <p id="saint-bio"></p>
        <a id="saint-link" href="#" target="_blank">Ver na Wikipédia</a>
    </div>

    <script src="script.js?v=7.0"></script>
</body>
</html>
